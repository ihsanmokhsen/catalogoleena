# Potongan konfigurasi Nginx untuk aaPanel (Website > Config).
# Sesuaikan path dan socket PHP-FPM dengan server.
# Penting: document root diarahkan ke folder public/, sehingga config/, src/, bin/, dan database/ tidak bisa diakses dari browser.

server_name oleena.hilmimokhsen.my.id;
root /www/wwwroot/oleena.hilmimokhsen.my.id/public;
index index.html;

# Batas ukuran body request (API hanya menerima JSON kecil).
client_max_body_size 64k;

# Header keamanan. Catatan: add_header di dalam blok location menimpa semua header di sini,
# jadi header yang dibutuhkan diulang di blok aset statis di bawah.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;

# Tolak file tersembunyi (.git, .env, dll.)
location ~ /\. {
    deny all;
}

# Panel admin: index.php sebagai halaman awal.
location /admin/ {
    index index.php;
    try_files $uri $uri/ =404;
}

# PHP hanya dijalankan di folder api/ dan admin/.
location ~ ^/(api|admin)/[a-z0-9_-]+\.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}

location ~ \.php$ {
    return 404;
}

# Cache aset statis
location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|css|js)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}
