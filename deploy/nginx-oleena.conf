# Potongan konfigurasi Nginx untuk aaPanel (Website > Config).
# Sesuaikan path dan socket PHP-FPM dengan server.
# Penting: document root diarahkan ke folder public/, sehingga config/, src/, dan database/ tidak bisa diakses dari browser.

server_name oleena.hilmimokhsen.my.id;
root /www/wwwroot/oleena.hilmimokhsen.my.id/public;
index index.html;

# Header keamanan
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Tolak file tersembunyi (.git, .env, dll.)
location ~ /\. {
    deny all;
}

# PHP hanya dijalankan di folder api/
location ~ ^/api/[a-z0-9_-]+\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
}

location ~ \.php$ {
    return 404;
}

# Cache aset statis
location ~* \.(jpg|jpeg|png|webp|avif|svg|ico|css|js)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}
